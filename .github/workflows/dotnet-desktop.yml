name: Сборка русской версии
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Проверка русских ресурсов
        shell: pwsh
        run: ./scripts/Verify-Localization.ps1
      - name: Сборка автономного релиза
        shell: pwsh
        run: ./scripts/Build-Release.ps1
      - name: Проверка запуска, названий и скриншотов WPF
        shell: pwsh
        run: |
          $app = Get-ChildItem artifacts/publish-*/RemnantSaveGuardian.exe | Select-Object -First 1
          $process = Start-Process -FilePath $app.FullName -ArgumentList '--screenshots', "$pwd/artifacts/screenshots" -PassThru -Wait -WindowStyle Hidden
          if ($process.ExitCode -ne 0) { throw 'Ошибка запуска интерфейса' }
          if (!(Test-Path artifacts/screenshots/capture-success.txt)) { throw 'Скриншоты не созданы' }
          $audit = Get-Content artifacts/screenshots/localization-audit.json -Raw | ConvertFrom-Json
          if (@($audit).Count -ne 0) { throw 'В базе есть предметы без русского названия' }
      - uses: actions/upload-artifact@v4
        with:
          name: RemnantSaveGuardianRU-win-x64
          path: |
            artifacts/*.zip
            artifacts/SHA256SUMS.txt
            artifacts/screenshots/*.png
